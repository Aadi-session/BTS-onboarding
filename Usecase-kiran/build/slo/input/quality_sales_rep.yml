name: sales-rep-quality-kb
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
  - onboarding
  - sales-rep-quality
  - BTS
description: Applying quality checks for the sales rep data

workflow:
  dag:
    - name: kiran-sales-rep
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:kiranschema/sales_reps
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate sales rep data
                - missing_count(sales_rep_id) = 0:
                    name: Sales rep table should not have any duplicate sales_rep_id
                    attributes:
                      category: Completeness

               
