name: products-quality-kb
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
  - onboarding
  - products-quality-check
  - BTS
description: Applying quality checks for the products dataset

workflow:
  dag:
    - name: kiran-products
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:kiranschema/products
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate expected schema for products dataset
                    fail:
                      when wrong column type:
                        product_id: integer
                        product_name: character varying
                        category: character varying
                        brand: character varying
                        unit_price: double
                    attributes:
                      category: Schema

                - missing_count(product_id) = 0:
                    name: Product ID should not be missing
                    attributes:
                      category: Completeness

                - missing_count(product_name) = 0:
                    name: Product name should not be missing
                    attributes:
                      category: Completeness

                - missing_count(category) = 0:
                    name: Category should not be missing
                    attributes:
                      category: Completeness

                - missing_count(brand) = 0:
                    name: Brand should not be missing
                    attributes:
                      category: Completeness

                - missing_count(unit_price) = 0:
                    name: Unit price should not be missing
                    attributes:
                      category: Completeness

                - invalid_count(unit_price) = 0:
                    name: Unit Price should be valid and non-zero
                    valid min: 0
                    attributes:
                      category: Validity

                

                