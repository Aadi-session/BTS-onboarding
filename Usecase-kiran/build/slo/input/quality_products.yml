
name: products-quality-kb
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
  - onboarding
  - products-quality-check
  - BTS
description: Applying quality checks for the products dataset

workflow:
  dag:
    - name: kiran-products
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:kiranschema/products
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
             checks:
                - sales_product_fk_violations = 0:
                    sales_product_fk_violations query: |
                      SELECT COUNT(DISTINCT s.product_id) AS sales_product_fk_violations
                      FROM "icebase"."srp_analysis".sales_fact s
                      LEFT JOIN "icebase"."srp_analysis".products p
                        ON s.product_id = p.product_id
                      WHERE s.product_id IS NOT NULL
                        AND p.product_id IS NULL
                    name: sales_fact product_id must exist in products
                    attributes:
                      category: Accuracy
                      severity: high
                - schema:
                    name: Validate schema for products dataset
                    fail:
                      when wrong column type:
                        product_id: varchar
                        product_name: varchar
                        category: varchar
                        brand: varchar
                        standard_price: double
                    attributes:
                      category: Schema

                - missing_count(product_id) = 0:
                    name: Product ID should not be missing
                    attributes:
                      category: Completeness

                - duplicate_count(product_id) = 0:
                    name: Product ID should not be duplicated
                    attributes:
                      category: Uniqueness

                - missing_count(product_name) = 0:
                    name: Product name should not be missing
                    attributes:
                      category: Completeness

                - missing_count(category) = 0:
                    name: Product category should not be missing
                    attributes:
                      category: Completeness

                - invalid_count(category) = 0:
                    name: Product category should be in allowed values
                    valid values:
                      - Footwear
                      - Apparel
                      - Accessories
                      - Equipment
                    attributes:
                      category: Validity

                - invalid_count(standard_price) = 0:
                    name: Standard price should be positive
                    valid min: 1
                    attributes:
                      category: Validity

                - avg_length(product_name) > 2:
                    name: Average product name length should be reasonable
                    attributes:
                      category: Accuracy

               