name: sales-aggregate-quality-kb
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
  - onboarding
  - sales-aggregate-quality-check
  - BTS
description: Applying quality checks for the sales-aggregate dataset

workflow:
  dag:
    - name: kiran-sales-aggregate
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:kiranschema/sales_rep_360_dataset
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate expected schema for sales_rep_360_dataset dataset
                    fail:
                      when wrong column type:
                        customer_id: integer
                        order_id: integer
                        sales_rep_id: integer
                        customer_join_date: timestamp without time zone
                        rep_join_date: timestamp without time zone
                        converted_order_id: integer
                    attributes:
                      category: Schema

                - missing_count(sale_revenue) = 0:
                    name: sale revenue should not be missing
                    attributes:
                      category: Completeness

                - missing_count(quantity) = 0:
                    name: Quantity should not be missing
                    attributes:
                      category: Completeness

                - min(sale_revenue) > 0:
                     name: sale_revenue should be non negative
                     attributes:
                        category: Accuracy
                        title: Validate minimum sales revenue requirement

                - min(quantity) > 0:
                     name: quantity should be non negative
                     attributes:
                        category: Accuracy
                        title: Validate minimum quantity requirement

                