tables:
  - name: sales_aggregate
    sql: {{ load_sql('sales_aggregate') }}
    description: Unified sales 360 dataset combining customer sales profile details, order transactions, and salesfact, salesreps, leads into a single source for analytics and reporting.
    data_source: icebase
    public: true

    dimensions:
      - name: customer_id
        description: Unique identifier for the customer.
        type: string
        sql: customer_id
        primary_key: true
        public: true

      - name: segment
        description: customer segment such as retail, wholesale or premium
        type: string
        sql: segment
        primary_key: true
        public: true

      - name: city
        description: City associated with the customer.
        type: string
        sql: city

      - name: state
        description: state associated with the customer.
        type: string
        sql: state

      - name: join_date
        description: Date when the customer joined.
        type: time
        sql: join_date

      - name: product_id
        description: Unique identifier for the product.
        type: string
        sql: product_id
        primary_key: true
        public: true

      - name: product_name
        description: Name of the product purchased by the customer.
        type: string
        sql: product_name

      - name: category
        description: category of the product purchased by the customer
        type: string
        sql: category

      - name: unit_price
        description: unit_price of product associated with the order
        type: number
        sql: unit_price

      - name: sales_rep_id
        description: Unique identifier for the sales_reps
        type: string
        sql: sales_rep_id
        primary_key: true
        public: true

      - name: region
        description: assigned region to sales representative
        type: string
        sql: region

      - name: target_month
        description: month of the target
        type: number
        sql: target_month

      - name: target_revenue
        description: revenue of the target
        type: string
        sql: target_revenue

      - name: target_units
        description: unit sales target
        type: number
        sql: target_units

      - name: target_orders
        description: order target
        type: integer
        sql: number

      - name: order_time
        description: Date when the order was placed.
        type: time
        sql: order_time

      - name: order_id
        description: Unique identifier for the sales fact.
        type: string
        sql: order_id

      - name: order_data
        description: date of sale
        type: time
        sql: order_data

      - name: store_id
        description: store identifier
        type: string
        sql: store_id

      - name: region
        description: region of sale
        type: string
        sql: region  

      - name: revenue
        description: revenue amount
        type: string
        sql: revenue  

      - name: quantity
        description: units sold
        type: string
        sql: quantity  

      - name: discount_amount
        description: discount given
        type: number
        sql: discount_amount  

      - name: cost_amount
        description: cost of goods sold
        type: number
        sql: cost_amount  

      - name: order_status
        description: order status
        type: string
        sql: order_status  

    measures:
      - name: total_revenue
        sql: amount
        type: sum
        description: Total revenue generated from all orders.

      - name: total_orders
        sql: order_id
        type: count
        description: Total number of orders.

      - name: sales_volume
        sql: quantity
        type: sum
        description: Total number of units sold by sales rep

      - name: target_achievement_pct
        sql: "(SUM(revenue) / target_revenue) * 100"
        type: number
        description: Actual revenue as a percentage of target revenue. Computed at rep + month level; handle divide-by-zero.

      - name: average_deal_size
        sql: "SUM(revenue) / COUNT(DISTINCT order_id)"
        type: number
        description: Average revenue per order.

      - name: revenue_per_customer
        sql: "SUM(revenue) / COUNT(DISTINCT customer_id)"
        type: number
        description: Average revenue per unique customer.

      - name: repeat_customer_rate
        sql: "(COUNT(DISTINCT CASE WHEN total_orders > 1 THEN customer_id END) / COUNT(DISTINCT customer_id)) * 100"
        type: number
        description: Percentage of customers with more than one order.

      - name: conversion_rate
        sql: "COUNT(DISTINCT CASE WHEN lead_status = 'Converted' OR converted_order_id IS NOT NULL THEN lead_id END) / COUNT(DISTINCT lead_id) * 100"
        type: number
        description: Percentage of leads converted into orders.

     # - name: month_over_month_revenue_growth
      #  sql: "((current_month_revenue - previous_month_revenue) / previous_month_revenue) * 100"
       # type: number
        #description: Percentage change in revenue compared to previous month. Handle zero previous month revenue.

      - name: gross_margin
        sql: "SUM(revenue - cost_amount)"
        type: sum
        description: Revenue minus cost amount.

      - name: gross_margin_percentage
        sql: "(SUM(revenue - cost_amount) / SUM(revenue)) * 100"
        type: number
        description: Gross margin as a percentage of revenue.

      - name: discount_pct
        sql: "(SUM(discount_amount) / SUM(revenue)) * 100"
        type: number
        description: Percentage discount relative to revenue.

      - name: top_products_by_rep
        sql: "SUM(revenue)"
        type: sum
        description: Highest revenue-contributing products for each rep. Grouped by sales_rep_id and product_id.

      - name: region_wise_performance
        sql: "SUM(revenue)"
        type: sum
        description: Total revenue and target achievement by region. Grouped by region.

      - name: sales_rep_rank
        sql: "RANK() OVER (ORDER BY SUM(revenue) DESC)"
        type: number
        description: Rank of each sales rep based on revenue or target achievement.

      - name: avg_orders_per_customer
        sql: "COUNT(DISTINCT order_id) / COUNT(DISTINCT customer_id)"
        type: number
        description: Average number of orders per customer for a sales rep.
