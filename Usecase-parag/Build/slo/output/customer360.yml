                #     sales_product_fk_violations query: |
                #         SELECT COUNT(DISTINCT s.product_id) AS sales_product_fk_violations
                #         FROM sales_fact s
                #         LEFT JOIN products p
                #         ON s.product_id = p.product_id
                #         WHERE s.product_id IS NOT NULL
                #         AND p.product_id IS NULL
                #         name: sales_fact product_id must exist in products
                #         attributes:
                #           category: Accuracy
                #             severity: high
 
                # - sales_customer_fk_violations = 0:
                #     sales_customer_fk_violations query: |
                #       SELECT COUNT(DISTINCT s.customer_id) AS sales_customer_fk_violations
                #         FROM sales_fact s
                #         LEFT JOIN customers c
                #           ON s.customer_id = c.customer_id
                #         WHERE s.customer_id IS NOT NULL
                #           AND c.customer_id IS NULL
                #           name: sales_fact customer_id must exist in customers
                #           attributes:
                #             category: Accuracy
                #             severity: high
 
                # - sales_region_consistency_violations = 0:
                #     sales_region_consistency_violations query: |
                #       SELECT COUNT(*) AS sales_region_consistency_violations
                #       FROM sales_fact s
                #       LEFT JOIN sales_reps r
                #         ON s.sales_rep_id = r.sales_rep_id
                #       WHERE s.region IS NOT NULL
                #         AND r.region IS NOT NULL
                #         AND s.region <> r.region
                #     name: sales_fact region must match sales_representative region
                #     attributes:
                #       category: Accuracy
                #       severity: high
 
