name: soda-sales360-quality
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
description: Applying quality checks for the sales 360 joined dataset
workspace: public

workflow:
  dag:
    - name: soda-sales360-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/sales_rep_360_dataset
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate expected schema for customer 360 dataset
                    fail:
                      when wrong column type:
                        customer_id: integer
                        customer_name: varchar
                        segment: varchar
                        phone: bigint
                        city: varchar
                        state: date
                        join_date: date
                        lead_id: string
                        created_date: date
                        sales_rep_id: string
                        lead_source: string
                        lead_status: string
                        converted_order_id: string
                        product_id: string
                        product_name: string
                        category: string
                        brand: string
                        order_id: string
                        store_id: string
                        region: string
                        revenue: decimal
                        quantity: integer
                        discount_amount: decimal
                        cost_amount: decimal
                        order_status: string
                        target_month: string
                        target_revenue: decimal
                        target_units: integer 
                        target_orders: integer
                        sales_rep_name: string
                        manager_name: string 
                        joining_date: date
                    attributes:
                      category: Schema

                - duplicate_count(order_id) = 0:
                    name: Order IDs should not be duplicated
                    attributes:
                      category: Uniqueness

                - missing_count(sales_rep_id) = 0:
                    name: Sales Rep ID should not be missing in completed transactions
                    attributes:
                      category: Completeness

                - unique_count(rep_id || target_month) = total_rows:
                    name: Target table should contain unique rep-month pairs
                    attributes:
                      category: Uniqueness

                - invalid_count(revenue) = 0:
                    name: Revenue should not be negative
                    valid min: 0
                    attributes:
                      category: Validity

                - invalid_count(quantity) = 0:
                    name: Quantity should not be negative
                    valid min: 0
                    attributes:
                      category: Validity

                - invalid_count(order_id) = 0:
                    name: Order IDs should map correctly to dimension tables
                    attributes:
                      category: Referential Integrity

                - invalid_count(customer_id) = 0:
                    name: Customer IDs should map correctly to dimension tables
                    attributes:
                      category: Referential Integrity

                - missing_count(region) = 0:
                    name: Region should not be missing
                    attributes:
                      category: Completeness

                - invalid_count(region) = 0:
                    name: Region consistency should match allowed region dimension
                    attributes:
                      category: Accuracy

                - missing_count(lead_conversion) = 0:
                    name: Lead conversion mapping should be present where provided
                    attributes:
                      category: Completeness

                - invalid_count(lead_conversion) = 0:
                    name: Lead conversion mapping should be valid if provided
                    valid values:
                      - Converted
                      - Not Converted
                    attributes:
                      category: Validity