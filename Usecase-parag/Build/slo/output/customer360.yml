                #     lead_conversion_mapping_violations query: |
                #       SELECT COUNT(DISTINCT l.lead_id) AS lead_conversion_mapping
                #       FROM leads l
                #       LEFT JOIN sales_fact s
                #         ON l.converted_order_id = s.order_id
