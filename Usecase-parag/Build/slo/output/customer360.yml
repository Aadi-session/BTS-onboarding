name: soda-sales360-quality
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
description: Applying quality checks for the sales 360 joined dataset
workspace: public
 
workflow:
  dag:
    - name: soda-sales360-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/sales_rep_360_dataset
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Valinumber expected schema for customer 360 dataset
                    fail:
                      when wrong column type:
                        customer_id: integer
                        order_id: integer
                        sales_rep_id: integer
                        customer_join_date: timestamp without time zone
                        rep_join_date: timestamp without time zone
                        converted_order_id: integer
                    attributes:
                      category: Schema
 
                - duplicate_count(order_id) = 0:
                    name: Order IDs should not be duplicated
                    attributes:
                      category: Uniqueness
 
                - missing_count(sales_rep_id) = 0:
                    name: Sales Rep ID should not be missing in completed transactions
                    filter: order_status = 'completed'
                    attributes:
                      category: Completeness
 
                # - unique_count(sales_rep_id, target_month) = 0:
                #     name: Target table should contain unique rep-month pairs
                #     attributes:
                #       category: Uniqueness
 
                - invalid_count(target_revenue) > 0:
                    name: Revenue should not be negative
                    valid min: 0
                    attributes:
                      category: Validity
 
                - invalid_count(quantity) > 0:
                    name: Quantity should not be negative
                    valid min: 0
                    attributes:
                      category: Validity
 
