name: soda-sales360-quality
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
description: Applying quality checks for the sales 360 joined dataset
workspace: public

workflow:
  dag:
    - name: soda-sales360-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO
        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/sales_rep_360_dataset
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate expected schema for customer 360 dataset
                    fail:
                      when wrong column type:
                        customer_id: integer
                        customer_name: varchar
                        segment: varchar
                        phone: bigint
                        city: varchar
                        state: date
                        join_date: date
                        lead_id: string
                        created_date: date
                        sales_rep_id: string
                        lead_source: string
                        lead_status: string
                        converted_order_id: string
                        product_id: string
                        product_name: string
                        category: string
                        brand: string
                        order_id: string
                        store_id: string
                        region: string
                        revenue: decimal
                        quantity: integer
                        discount_amount: decimal
                        cost_amount: decimal
                        order_status: string
                        target_month: string
                        target_revenue: decimal
                        target_units: integer 
                        target_orders: integer
                        sales_rep_name: string
                        manager_name: string 
                        joining_date: date
                    attributes:
                      category: Schema

                - duplicate_count(order_id) = 0:
                    name: Order IDs should not be duplicated
                    attributes:
                      category: Uniqueness

                - missing_count(sales_rep_id) = 0:
                    name: Sales Rep ID should not be missing in completed transactions
                    filter: order_status = 'completed'
                    attributes:
                      category: Completeness

                - unique_count(sales_rep_id, target_month) = 0:
                    name: Target table should contain unique rep-month pairs
                    attributes:
                      category: Uniqueness

                - invalid_count(revenue) > 0:
                    name: Revenue should not be negative
                    valid min: 0
                    attributes:
                      category: Validity

                - invalid_count(quantity) > 0:
                    name: Quantity should not be negative
                    valid min: 0
                    attributes:
                      category: Validity

                - sales_product_fk_violations = 0:
                    sales_product_fk_violations query: |
                        SELECT COUNT(DISTINCT s.product_id) AS sales_product_fk_violations
                        FROM sales_fact s
                        LEFT JOIN products p
                        ON s.product_id = p.product_id
                        WHERE s.product_id IS NOT NULL
                        AND p.product_id IS NULL
                        name: sales_fact product_id must exist in products
                        attributes:
                          category: Accuracy
                            severity: high

                - sales_customer_fk_violations = 0:
                    sales_customer_fk_violations query: |
                      SELECT COUNT(DISTINCT s.customer_id) AS sales_customer_fk_violations
                        FROM sales_fact s
                        LEFT JOIN customers c
                          ON s.customer_id = c.customer_id
                        WHERE s.customer_id IS NOT NULL
                          AND c.customer_id IS NULL
                          name: sales_fact customer_id must exist in customers
                          attributes:
                            category: Accuracy
                            severity: high

                - sales_region_consistency_violations = 0:
                    sales_region_consistency_violations query: |
                      SELECT COUNT(*) AS sales_region_consistency_violations
                      FROM sales_fact s
                      LEFT JOIN sales_reps r
                        ON s.sales_rep_id = r.sales_rep_id
                      WHERE s.region IS NOT NULL
                        AND r.region IS NOT NULL
                        AND s.region <> r.region
                    name: sales_fact region must match sales_representative region
                    attributes:
                      category: Accuracy
                      severity: high

                - lead_conversion_mapping = 0:
                    lead_conversion_mapping_violations query: |
                      SELECT COUNT(DISTINCT l.lead_id) AS lead_conversion_mapping
                      FROM leads l
                      LEFT JOIN sales_fact s
                        ON l.converted_order_id = s.order_id
                      WHERE l.converted_order_id IS NOT NULL
                        AND s.order_id IS NULL
                    name: lead conversion must map to a valid sales_fact order
                    attributes:
                      category: Accuracy
                      severity: high