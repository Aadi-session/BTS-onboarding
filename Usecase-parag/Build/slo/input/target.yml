name: soda-sales-quality-minerva
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
  - sales
description: Applying quality checks for the customers sales data
workspace: public
workflow:
  # schedule:
  #   cron: '00 08 * * *'
  #   concurrencyPolicy: Forbid
  dag:
    - name: soda-target-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO

        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/targets
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate schema for customers dataset
                    fail:
                      when wrong column type:
                        sales_rep_id: string
                        target_month: string
                        target_revenue: decimal
                        target_units: integer 
                        target_orders: integer
                    attributes:
                      category: Schema

                - missing_count(sales_rep_id) = 0:
                    name: Customer ID should not be missing
                    attributes:
                      category: Completeness

                - duplicate_count(sales_rep_id) = 0:
                    name: Customer ID should not be duplicated
                    attributes:
                      category: Uniqueness

                - invalid_count(sales_rep_id) = 0:
                    name: Customer ID should be greater than zero
                    valid min: 1
                    attributes:
                      category: Validity

                - missing_count(target_month) = 0:
                    name: Customer name should not be missing
                    attributes:
                      category: Completeness

                - missing_count(target_revenue) = 0:
                    name: Customer email should not be missing
                    attributes:
                      category: Completeness

                - missing_count(target_units) = 0:
                    name: City should not be missing
                    attributes:
                      category: Completeness

                - missing_count(target_orders) = 0:
                    name: City should not be missing
                    attributes:
                      category: Completeness