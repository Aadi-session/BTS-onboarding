name: soda-orders-quality-minerva
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
description: Applying quality checks for the orders data
workspace: public

workflow:
  # schedule:
  #   cron: '00 08 * * *'
  #   concurrencyPolicy: Forbid

  dag:
    - name: soda-product-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO

        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/products
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate schema for orders dataset
                    fail:
                      when wrong column type:
                        product_id: string
                        product_name: string
                        category: string
                        brand: string
                        unit_price: decimal
                    attributes:
                      category: Schema

                - missing_count(product_id) = 0:
                    name: Order ID should not be missing
                    attributes:
                      category: Completeness

                - duplicate_count(product_id) = 0:
                    name: Order ID should not be duplicated
                    attributes:
                      category: Uniqueness

                - invalid_count(product_id) = 0:
                    name: Order ID should be greater than zero
                    valid min: 1
                    attributes:
                      category: Validity

                - missing_count(product_name) = 0:
                    name: Product name should not be missing
                    attributes:
                      category: Completeness

                - invalid_count(unit_price) = 0:
                    name: Order amount should not be negative
                    valid min: 0
                    attributes:
                      category: Validity

                - avg_length(unit_price) > 0:
                    name: Average length of product name should be greater than 2
                    attributes:
                      category: Accuracy