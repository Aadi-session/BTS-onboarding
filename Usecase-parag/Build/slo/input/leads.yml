name: soda-leads-quality-minerva
version: v1
type: workflow
tags:
  - workflow
  - soda-checks
description: Applying quality checks for the leads data
workspace: public

workflow:
  # schedule:
  #   cron: '00 08 * * *'
  #   concurrencyPolicy: Forbid
  dag:
    - name: soda-leads-quality
      spec:
        stack: soda+python:1.0
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        logLevel: INFO

        stackSpec:
          inputs:
            - dataset: dataos://icebase:paragschema/leads
              options:
                engine: minerva
                clusterName: training
              profile:
                columns:
                  - include *
              checks:
                - schema:
                    name: Validate schema for customer events dataset
                    fail:
                      when wrong column type:
                        lead_id: string
                        created_date: date
                        sales_rep_id: string
                        customer_id: string
                        lead_source: string
                        lead_status: string
                        converted_order_id: string
                    attributes:
                      category: Schema

                - missing_count(lead_id) = 0:
                    name: Event ID should not be missing
                    attributes:
                      category: Completeness

                - duplicate_count(lead_id) = 0:
                    name: Event ID should not be duplicated
                    attributes:
                      category: Uniqueness

                - invalid_count(lead_id) = 0:
                    name: Event ID should be greater than zero
                    valid min: 1
                    attributes:
                      category: Validity

                - missing_count(customer_id) = 0:
                    name: Customer ID should not be missing in events
                    attributes:
                      category: Completeness

                - invalid_count(customer_id) = 0:
                    name: Customer ID in events should be greater than zero
                    valid min: 1
                    attributes:
                      category: Validity

                - missing_count(sales_rep_id) = 0:
                    name: Customer ID should not be missing in events
                    attributes:
                      category: Completeness

                - invalid_count(sales_rep_id) = 0:
                    name: Customer ID in events should be greater than zero
                    valid min: 1
                    attributes:
                      category: Validity

                - missing_count(lead_status) = 0:
                    name: Event type should not be missing
                    attributes:
                      category: Completeness

                - invalid_count(lead_source) = 0:
                    name: lead_source should be valid
                    valid values:
                      - campaign
                      - referral
                      - walk-in
                    attributes:
                      category: Validity